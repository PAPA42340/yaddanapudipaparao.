<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>light ON-OFF</title>
    

</head>

<body>
    <h1> Light ON-OFF</h1>
    <img id="lightimage" src="./lightoff.png" alt="Light off">
    <button onclick ="turnon()">ON </button>
    <button onclick ="turnoff()">OFF</button>
    <script>
        function turnon(){
            document.getElementById('lightimage').src='./lighton.png';
        
        }
        function turnoff(){
            document.getElementById('lightimage').src='./lightoff.png';
        }
    </script>
</body>
</html>
